name: Update Starred Repos

permissions:
  contents: write   # Allow pushing commits

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger from Actions tab
  push:
    paths:
      - '.github/workflows/update-starred-repos.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and write starred repos
        run: |
          curl -s "https://api.github.com/users/Thayaa21/starred?per_page=20&sort=created" | \
          jq '[.[] | {
            name: .name,
            full_name: .full_name,
            desc: (.description // "No description"),
            url: .html_url,
            language: (.language // "N/A"),
            stars: .stargazers_count,
            image: "https://opengraph.githubassets.com/1/\(.full_name)"
          }]' > starred-repos.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add starred-repos.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update starred repos from GitHub"
            git push
          fi
